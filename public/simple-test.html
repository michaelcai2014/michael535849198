<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单登录测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>简单登录测试</h1>
    
    <button onclick="testLogin()">测试登录</button>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('开始测试登录...');
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: 'Michael', password: '123456' })
                });
                
                console.log('响应状态:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('响应数据:', data);
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>登录成功!</h3>
                        <p>用户: ${data.data.user.username}</p>
                        <p>角色: ${data.data.user.role}</p>
                        <p>Token: ${data.data.token}</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>登录失败</h3><p>${data.message}</p>`;
                }
            } catch (error) {
                console.error('登录错误:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>网络错误</h3><p>${error.message}</p>`;
            }
            
            resultDiv.style.display = 'block';
        }
        
        // 页面加载时自动测试
        window.addEventListener('load', function() {
            console.log('页面加载完成，开始自动测试...');
            testLogin();
        });
    </script>
</body>
</html>
